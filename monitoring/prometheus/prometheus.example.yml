# Copy outside the repository, set the verified target, and keep the token file
# readable only by the Prometheus process. The token must map to an `operator`
# role in RAG_API_KEYS_JSON; do not use an administrator or deployment secret.
global:
  scrape_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/rag-platform.yml

scrape_configs:
  - job_name: rag-platform
    scheme: http
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/secrets/rag-platform-operator.token
    static_configs:
      # Replace with a private DNS name or host address. If Prometheus runs in
      # the same Compose network, this may be `api:8000` instead.
      - targets: ["rag-platform.internal:8000"]
