# Optional production overlay. It replaces credential environment values with
# Docker Compose secret mounts; it never stores a secret in this repository.
#
# Create the two ignored files under ./secrets, then run:
# docker compose -f compose.yaml -f compose.secrets.example.yaml up -d
services:
  api:
    environment:
      RAG_API_KEYS_JSON: ""
      RAG_API_KEYS_JSON_FILE: /run/secrets/rag_api_keys_json
      ZHIPU_API_KEY: ""
      ZHIPU_API_KEY_FILE: /run/secrets/zhipu_api_key
    secrets:
      - source: rag_api_keys_json
        target: rag_api_keys_json
      - source: zhipu_api_key
        target: zhipu_api_key

secrets:
  rag_api_keys_json:
    file: ./secrets/rag_api_keys_json
  zhipu_api_key:
    file: ./secrets/zhipu_api_key
