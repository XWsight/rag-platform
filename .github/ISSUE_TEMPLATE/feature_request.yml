name: 功能建议
description: 提议与通用、可派生 RAG 基座目标一致的改进。
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述目标用户、约束和当前不足；不要只描述某个实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与扩展边界
      description: 说明应放在核心、Runtime Profile、Provider、派生层或独立前端，以及兼容性影响。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 验证方式
      description: 说明需要哪些单元、恢复、安全、性能或领域评测证据。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我未包含敏感数据、密钥或受限第三方内容。
          required: true
        - label: 我已阅读 CONTRIBUTING.md 与 docs/customization.md。
          required: true
