name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  publish-release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Require stable package version and matching tag
        run: python scripts/verify_release.py --tag "${GITHUB_REF_NAME}"
      - name: Verify and install locked runtime dependencies
        run: |
          python scripts/verify_dependency_lock.py
          python -m pip install --find-links https://download.pytorch.org/whl/cpu/torch/ --require-hashes -r requirements-py312.lock
      - name: Generate SPDX dependency inventory
        run: >-
          python scripts/generate_runtime_sbom.py
          --requirements requirements.txt
          --output reports/runtime-sbom.spdx.json
      - name: Generate release-input manifest
        run: >-
          python scripts/release_manifest.py
          --require-clean
          --json-output reports/release-manifest.json
      - name: Prepare OCI image metadata
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Build and publish immutable container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image reference
        run: >-
          python scripts/release_image_evidence.py
          --image ghcr.io/${{ github.repository }}
          --digest ${{ steps.build.outputs.digest }}
          --source-revision ${{ github.sha }}
          --output reports/release-image.json
      - name: Create GitHub release with review artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          reports/runtime-sbom.spdx.json
          reports/release-manifest.json
          reports/release-image.json
          --generate-notes
          --title "RAG Studio ${GITHUB_REF_NAME}"
