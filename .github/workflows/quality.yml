name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test tools
        run: >-
          python -m pip install
          requests==2.34.2
          fastapi==0.141.1
          python-multipart==0.0.32
          uvicorn==0.52.1
          httpx==0.28.1
          coverage[toml]==7.15.2
          mypy==2.3.0
          packaging==26.3
          ruff==0.15.22
      - name: Static checks
        run: |
          python scripts/scan_secrets.py
          ruff check .
          mypy
          python scripts/verify_wheel.py
          python scripts/verify_openapi_contract.py
      - name: Deterministic retrieval quality gate
        run: >-
          python scripts/benchmark_sparse.py
          evals/retrieval_cases.jsonl
          evals/corpus/rag.md
          evals/corpus/retrieval.md
          evals/corpus/safety.md
          evals/corpus/storage.md
          --top-k 5
          --quality-gate evals/gates/bm25-smoke.json
          --json-output reports/bm25-smoke.json
          --markdown-output reports/bm25-smoke.md
      - name: Validate full retrieval benchmark suite
        run: >-
          python scripts/validate_retrieval_suite.py
          evals/retrieval_suite.json
          --contract evals/gates/retrieval-suite.json
          --json-output reports/retrieval-suite.json
          --markdown-output reports/retrieval-suite.md
      - name: Validate structured-answer benchmark suite
        run: >-
          python scripts/validate_answer_suite.py
          evals/answer_suite.json
          --contract evals/gates/answer-suite.json
          --json-output reports/answer-suite.json
          --markdown-output reports/answer-suite.md
      - name: Full deterministic retrieval baseline
        run: >-
          python scripts/benchmark_sparse.py
          evals/retrieval_suite.json
          --top-k 5
          --quality-gate evals/gates/bm25-foundation.json
          --json-output reports/bm25-foundation.json
          --markdown-output reports/bm25-foundation.md
      - name: Unit tests with branch coverage
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report

  declared-development-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime dependencies and direct development tools
        run: |
          python scripts/verify_dependency_lock.py
          python -m pip install --find-links https://download.pytorch.org/whl/cpu/torch/ --require-hashes -r requirements-py311.lock
          python -m pip install -r requirements-dev.txt
      - name: Verify resolved environment
        run: |
          python -m pip check
          python -c "import httpx; assert httpx.__version__ == '0.28.1'"

  locked-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify and install the hashed runtime closure
        run: |
          python scripts/verify_dependency_lock.py
          python -m pip install --find-links https://download.pytorch.org/whl/cpu/torch/ --require-hashes -r requirements-py${{ matrix.python-version == '3.11' && '311' || '312' }}.lock
          python -m pip check

  browser-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify same-origin browser API and safe rendering contract
        run: node --test tests/web_ui_contract.test.mjs

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install isolated browser-fixture dependencies
        run: >-
          python -m pip install
          fastapi==0.141.1
          httpx==0.28.1
          python-multipart==0.0.32
          uvicorn==0.52.0
      - name: Install locked browser runner
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise critical browser workflows against the HTTP API
        run: npm run test:browser

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Audit pinned direct runtime requirements
        run: |
          python -m pip install pip-audit==2.10.1
          python scripts/audit_dependencies.py

  runtime-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime dependencies
        run: >-
          python -m pip install --find-links https://download.pytorch.org/whl/cpu/torch/
          --require-hashes -r requirements-py312.lock
      - name: Generate runtime SPDX inventory
        run: >-
          python scripts/generate_runtime_sbom.py
          --requirements requirements.txt
          --output reports/runtime-sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-sbom-${{ github.sha }}
          path: reports/runtime-sbom.spdx.json
          if-no-files-found: error

  release-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Create versioned release-input manifest
        run: >-
          python scripts/release_manifest.py
          --require-clean
          --json-output reports/release-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.sha }}
          path: reports/release-manifest.json
          if-no-files-found: error

  recovery-and-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight recovery-test dependencies
        run: >-
          python -m pip install
          requests==2.34.2
          fastapi==0.141.1
          python-multipart==0.0.32
          httpx==0.28.1
      - name: Exercise durable startup, job archive, and recovery state machines
        run: >-
          python -m unittest
          tests.test_bootstrap
          tests.test_job_store
          tests.test_indexing_workflow
          tests.test_platform
          -v

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated Compose configuration
        shell: bash
        run: |
          cat > .env <<'EOF'
          RAG_PERSIST_DATA=true
          RAG_STORAGE_ROOT=/data
          RAG_PRODUCT_NAME=RAG Platform CI
          RAG_PRODUCT_TAGLINE=Container smoke test
          RAG_API_KEYS_JSON={"ci-smoke-key-0123456789abcdef":{"subject":"ci","tenant_id":"ci","roles":["reader","writer","operator"]}}
          RAG_IMAGE_TAG=ci-${{ github.run_id }}-${{ github.run_attempt }}
          RAG_SOURCE_REVISION=${{ github.sha }}
          RAG_DATA_VOLUME=rag-platform-ci-${{ github.run_id }}-${{ github.run_attempt }}
          RAG_BIND_ADDRESS=127.0.0.1
          RAG_PUBLISHED_PORT=8000
          EOF
          docker compose -p rag-platform-ci config --quiet
      - name: Build hardened image
        run: docker compose -p rag-platform-ci build api
      - name: Verify image source revision label
        shell: bash
        run: |
          image="rag-platform:ci-${{ github.run_id }}-${{ github.run_attempt }}"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "${{ github.sha }}"
      - name: Start service and verify health plus authentication
        shell: bash
        run: |
          docker compose -p rag-platform-ci up -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health/ready; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            -H 'X-API-Key: ci-smoke-key-0123456789abcdef' \
            http://127.0.0.1:8000/v1/knowledge-bases
      - name: Exercise backup and restore on a new volume
        shell: bash
        run: |
          source_volume=rag-platform-ci-${{ github.run_id }}-${{ github.run_attempt }}
          restore_volume=rag-platform-restore-${{ github.run_id }}-${{ github.run_attempt }}
          backup_directory="${RUNNER_TEMP}/rag-platform-backup-${{ github.run_id }}-${{ github.run_attempt }}"
          backup_archive="${backup_directory}/data.tar.gz"
          mkdir -p "$backup_directory"
          docker compose -p rag-platform-ci stop api
          docker run --rm \
            -v "${source_volume}:/data:ro" \
            -v "${backup_directory}:/backup" \
            busybox:1.37.0 tar -C /data -czf /backup/data.tar.gz .
          docker volume create "$restore_volume"
          docker run --rm \
            -v "${restore_volume}:/restore" \
            -v "${backup_directory}:/backup:ro" \
            busybox:1.37.0 tar -C /restore -xzf /backup/data.tar.gz
          RAG_DATA_VOLUME="$restore_volume" RAG_PUBLISHED_PORT=8012 \
            docker compose -p rag-platform-restore up -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8012/health/ready; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            -H 'X-API-Key: ci-smoke-key-0123456789abcdef' \
            http://127.0.0.1:8012/v1/knowledge-bases
      - name: Show Compose diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose -p rag-platform-ci ps || true
          docker compose -p rag-platform-ci logs --tail=300 api || true
          RAG_DATA_VOLUME=rag-platform-restore-${{ github.run_id }}-${{ github.run_attempt }} \
            RAG_PUBLISHED_PORT=8012 docker compose -p rag-platform-restore ps || true
          RAG_DATA_VOLUME=rag-platform-restore-${{ github.run_id }}-${{ github.run_attempt }} \
            RAG_PUBLISHED_PORT=8012 docker compose -p rag-platform-restore logs --tail=300 api || true
      - name: Remove CI containers and volumes
        if: always()
        shell: bash
        run: |
          RAG_DATA_VOLUME=rag-platform-restore-${{ github.run_id }}-${{ github.run_attempt }} \
            RAG_PUBLISHED_PORT=8012 docker compose -p rag-platform-restore down --volumes --remove-orphans
          docker volume rm rag-platform-restore-${{ github.run_id }}-${{ github.run_attempt }} || true
          docker compose -p rag-platform-ci down --volumes --remove-orphans

  secret-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Create isolated Compose secret fixture
        shell: bash
        run: |
          mkdir -p secrets
          printf '%s' '{"compose-secret-key-0123456789abcdef":{"subject":"secret-ci","tenant_id":"secret-ci","roles":["reader","writer","operator"]}}' > secrets/rag_api_keys_json
          : > secrets/zhipu_api_key
          chmod 0444 secrets/rag_api_keys_json secrets/zhipu_api_key
          cat > .env <<'EOF'
          RAG_PERSIST_DATA=true
          RAG_STORAGE_ROOT=/data
          RAG_PRODUCT_NAME=RAG Platform secret CI
          RAG_PRODUCT_TAGLINE=Compose secret mount test
          RAG_API_KEYS_JSON={"plaintext-key-must-not-work-0123456789":{"subject":"plaintext","tenant_id":"plaintext","roles":["reader"]}}
          ZHIPU_API_KEY=your_placeholder_provider_key
          RAG_IMAGE_TAG=secret-ci-${{ github.run_id }}-${{ github.run_attempt }}
          RAG_SOURCE_REVISION=${{ github.sha }}
          RAG_DATA_VOLUME=rag-platform-secret-ci-${{ github.run_id }}-${{ github.run_attempt }}
          RAG_BIND_ADDRESS=127.0.0.1
          RAG_PUBLISHED_PORT=8014
          EOF
          docker compose -f compose.yaml -f compose.secrets.example.yaml -p rag-platform-secret-ci config --quiet
      - name: Build and start with mounted secret files
        shell: bash
        run: |
          docker compose -f compose.yaml -f compose.secrets.example.yaml -p rag-platform-secret-ci build api
          docker compose -f compose.yaml -f compose.secrets.example.yaml -p rag-platform-secret-ci up -d
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:8014/health/ready; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              exit 1
            fi
            sleep 2
          done
      - name: Verify mounted API key wins over plaintext environment value
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H 'X-API-Key: compose-secret-key-0123456789abcdef' \
            http://127.0.0.1:8014/v1/knowledge-bases
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'X-API-Key: plaintext-key-must-not-work-0123456789' \
            http://127.0.0.1:8014/v1/knowledge-bases)"
          test "$status" = "401"
      - name: Show Compose diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker compose -f compose.yaml -f compose.secrets.example.yaml -p rag-platform-secret-ci ps || true
          docker compose -f compose.yaml -f compose.secrets.example.yaml -p rag-platform-secret-ci logs --tail=300 api || true
      - name: Remove CI secret fixture and volume
        if: always()
        shell: bash
        run: |
          docker compose -f compose.yaml -f compose.secrets.example.yaml -p rag-platform-secret-ci down --volumes --remove-orphans
          docker volume rm rag-platform-secret-ci-${{ github.run_id }}-${{ github.run_attempt }} || true
          rm -rf secrets .env

  quality-gate:
    if: always()
    needs:
      - unit-tests
      - declared-development-environment
      - locked-runtime
      - browser-contract
      - browser-e2e
      - dependency-audit
      - runtime-sbom
      - release-manifest
      - recovery-and-durability
      - container-smoke
      - secret-source-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to succeed
        shell: bash
        run: |
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.declared-development-environment.result }}" = "success"
          test "${{ needs.locked-runtime.result }}" = "success"
          test "${{ needs.browser-contract.result }}" = "success"
          test "${{ needs.browser-e2e.result }}" = "success"
          test "${{ needs.dependency-audit.result }}" = "success"
          test "${{ needs.runtime-sbom.result }}" = "success"
          test "${{ needs.release-manifest.result }}" = "success"
          test "${{ needs.recovery-and-durability.result }}" = "success"
          test "${{ needs.container-smoke.result }}" = "success"
          test "${{ needs.secret-source-smoke.result }}" = "success"
