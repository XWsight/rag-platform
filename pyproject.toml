[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-platform"
version = "2.0.0.dev0"
description = "Privacy-aware hybrid retrieval and grounded question answering"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.141,<0.142",
  "gradio>=6.22,<7",
  "langchain-huggingface>=1.2,<2",
  "pypdf>=6.15,<7",
  "python-dotenv>=1.2,<2",
  "python-multipart>=0.0.32,<0.0.33",
  "requests>=2.34,<3",
  "sentence-transformers>=5.7,<6",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.15,<8",
  "httpx>=0.28,<0.29",
  "mypy>=2.3,<2.4",
  "pip-audit>=2.10,<3",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
include = ["rag_system*"]

[tool.setuptools.package-data]
rag_system = ["web_ui/*.html", "web_ui/assets/*.css", "web_ui/assets/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".venv-test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
show_error_codes = true
files = [
  "rag_system",
]

[[tool.mypy.overrides]]
module = [
  "dotenv",
  "gradio",
  "langchain_huggingface",
  "pypdf",
  "sentence_transformers",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "rag_system.api",
  "rag_system.api_answer_routes",
  "rag_system.api_error_handlers",
  "rag_system.api_request_context",
  "rag_system.api_resource_routes",
  "rag_system.web_ui",
]
# FastAPI route decorators are dynamically typed. Keep strict checking of
# function bodies while suppressing this third-party decorator limitation.
disable_error_code = ["untyped-decorator"]

[tool.coverage.run]
branch = true
source = ["rag_system"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
